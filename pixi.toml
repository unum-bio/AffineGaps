[workspace]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
channels = ["conda-forge", "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community"]
description = "Needleman-Wunsch and Smith-Waterman with affine gaps, scoring and traceback, on GPUs"
license = "Apache-2.0"
license-file = "LICENSE"
name = "affinegaps"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
readme = "README.md"
version = "0.2.5"

[dependencies]
max = ">=26.5,<27"
mojo = ">=1.0.0,<2"
numpy = ">=2.0"
python = "3.12.*"

[pypi-dependencies]
biopython = "*"
pytest = "*"
pytest-repeat = "*"
stringzilla = "*"

[tasks]
# Mojo refuses to emit a shared library from a file defining `main`, so the region is stripped first.
build = "python scripts/build_extension.py"
build-cli = "mojo build affinegaps.mojo -o build/affinegaps"
test = {cmd = "pytest test.py", depends-on = ["build"]}

# The build hook compiles the kernels into the wheel, so this needs no `build` step of its own.
install = "uv tool install --force ."
