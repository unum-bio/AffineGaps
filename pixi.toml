[workspace]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
channels = ["conda-forge", "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community"]
description = "Needleman-Wunsch and Smith-Waterman with affine gaps, scoring and traceback, on GPUs"
license = "Apache-2.0"
license-file = "LICENSE"
name = "affinegaps"
platforms = ["linux-64"]
readme = "README.md"
version = "0.2.5"

[dependencies]
max = ">=26.5,<27"
mojo = ">=1.0.0,<2"
numpy = ">=2.0"
python = "3.12.*"

[pypi-dependencies]
biopython = "*"
pytest = "*"
pytest-repeat = "*"
stringzilla = "*"

[tasks]
# `main` and the library share one source file, and Mojo refuses to emit a shared library from a
# file that defines `main`, so the extension is compiled from a copy with that region stripped.
build = "python scripts/build_extension.py"
build-cli = "mojo build affinegaps.mojo -o build/affinegaps"
test = {cmd = "pytest test.py", depends-on = ["build"]}

# Puts the `affinegaps` command on the PATH, compiled kernels included. `pixi global install --git`
# cannot serve this repository, because it reads `pyproject.toml` and requires `[tool.pixi.*]`
# tables that would duplicate this manifest.
install = {cmd = "uv tool install --force --with-editable . .", depends-on = ["build"]}
