[build-system]
build-backend = "hatchling.build"
# `mojo` compiles the kernels and `max` carries the GPU host types they import; `patchelf`
# repoints the result at the wheel. None can be conditioned on an extra, so every install pays
# roughly 125 MB for them; where Mojo ships no wheel the hook emits the pure-Python one instead.
requires = ["hatchling", "packaging", "mojo>=1.0,<2", "max>=26.5,<27", "patchelf>=0.17; sys_platform == 'linux'"]

[project]
authors = [
  {name = "Ash Vardanian", email = "1983160+ashvardanian@users.noreply.github.com"},
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = ["numpy"]
description = "Needleman-Wunsch and Smith-Waterman with affine gaps, scoring and traceback, on GPUs"
keywords = ["bioinformatics", "sequence alignment", "gpu", "affine gaps", "mojo"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "affinegaps"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
version = "0.2.5"

[project.urls]
Homepage = "https://github.com/unum-bio/AffineGaps"
Repository = "https://github.com/unum-bio/AffineGaps.git"

# One optional extra, not two overlapping ones: `numba` used to omit `colorama`, so anyone
# following the README lost coloured output without being told.
# Named for what they deliver. `jit` used to mean Numba while bundling terminal colour, which
# became ambiguous once the project gained a second compiler.
[project.optional-dependencies]
color = ["colorama"]
numba = ["numba"]

# A group rather than an extra, so the checkers stay out of the published wheel's metadata.
[dependency-groups]
lint = ["ruff>=0.15", "black>=26", "mypy>=2", "numpy"]
test = ["biopython", "stringzilla", "pytest", "pytest-repeat"]

[tool.pytest.ini_options]
addopts = "-q" # no -x: with a backend axis, every backend's failure matters

# Configuration options for the Black formatter:
# https://black.readthedocs.io/en/latest/usage_and_configuration/the_basics.html#where-black-looks-for-the-file
[tool.black]
line-length = 120 # Set line length to the same value as in `.clang-format` for modern wide screens
target-version = ['py312'] 

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["affinegaps.py"] 
ignore_missing_imports = true # NumBa and colorama are optional at runtime
python_version = "3.12" 

# Without an explicit target hatchling sweeps the Mojo sources and the test file into the sdist.
[tool.hatch.build.targets.sdist]
include = ["affinegaps.py", "affinegaps.mojo", "scripts", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["affinegaps.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[project.scripts]
affinegaps = "affinegaps:main"
