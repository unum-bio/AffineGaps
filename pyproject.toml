[build-system]
build-backend = "hatchling.build"
# `max` carries the compiler and the GPU host types; `patchelf` repoints the result at the wheel.
# The markers match the platforms Modular ships wheels for; elsewhere the hook emits pure Python.
requires = [
  "hatchling",
  "packaging",
  "max>=26.5,<27; (sys_platform == 'linux' and platform_machine in 'x86_64 aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
  "patchelf>=0.17; sys_platform == 'linux'",
]

[project]
authors = [
  {name = "Ash Vardanian", email = "1983160+ashvardanian@users.noreply.github.com"},
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = ["numpy"]
description = "Needleman-Wunsch and Smith-Waterman with affine gaps, scoring and traceback, on GPUs"
keywords = ["bioinformatics", "sequence alignment", "gpu", "affine gaps", "mojo"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "affinegaps"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
version = "0.2.5"

[project.urls]
Homepage = "https://github.com/unum-science/AffineGaps"
Repository = "https://github.com/unum-science/AffineGaps.git"

[project.optional-dependencies]
color = ["colorama"]
numba = ["numba"]

# A group rather than an extra, so the checkers stay out of the published wheel's metadata.
[dependency-groups]
lint = ["ruff>=0.15", "black>=26", "mypy>=2", "numpy"]
test = ["biopython", "stringzilla", "pytest", "pytest-repeat"]

[tool.pytest.ini_options]
addopts = "-q" # no -x: with a backend axis, every backend's failure matters

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["affinegaps.py"] 
ignore_missing_imports = true # NumBa and colorama are optional at runtime
python_version = "3.12" 

# Without an explicit target hatchling sweeps the Mojo sources and the test file into the sdist.
[tool.hatch.build.targets.sdist]
include = ["affinegaps.py", "affinegaps.mojo", "scripts", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["affinegaps.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[project.scripts]
affinegaps = "affinegaps:main"
