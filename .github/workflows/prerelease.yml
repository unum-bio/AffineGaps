name: Pre-Release

on:
  push:
    branches: ["main-dev"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", "assets/**"]
  pull_request:
    branches: ["main", "main-dev"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", "assets/**"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            pyproject.toml:^version = "(\d+\.\d+\.\d+)"
            pixi.toml:^version = "(\d+\.\d+\.\d+)"
            affinegaps.py:^__version__ = "(\d+\.\d+\.\d+)"
          dry-run: "true"

  # Gates the matrix below. A formatting or typing break is the same on every interpreter, so
  # finding it once on the oldest supported one beats finding it three times in parallel.
  lint:
    name: Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Checkers
        run: |
          python -m pip install --upgrade pip
          pip install --group lint
      - name: Format
        run: black --check --diff affinegaps.py test.py
      - name: Lint
        run: ruff check affinegaps.py test.py
      - name: Types
        run: mypy

  # A hosted runner has no GPU, so this compiles and does not execute. It exists because nothing
  # else in CI touches the Mojo half, so a compile break would otherwise reach `main` unnoticed.
  # Hosted runners have no GPU, so this compiles and does not execute. Mojo ships wheels for
  # Linux on x86-64 and ARM and for macOS on Apple silicon, so all three are built rather than
  # one being built and three being claimed.
  build_mojo:
    name: Mojo Compiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest
          cache: true
      - name: Build the Extension
        run: pixi run build
      - name: Build the Native Tool
        run: pixi run build-cli
      - name: Assert the Module Loads
        run: pixi run python -c "import sys; sys.path.insert(0, 'build'); import affinegaps_mojo; print(sorted(n for n in dir(affinegaps_mojo) if not n.startswith('_')))"

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group test
      - name: Test
        run: pytest test.py -x -q
